<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rivo</title>
    <style>
        *{
            margin: 0;
            padding:0;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #C2EFD4;

        }
        header {
            color: #224F34;
            padding: 30px 0px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            justify-content: space-around;
            background: #C2EFD4;
            
        }
        .logo {
            font-family: Elephant;
            
        }
        nav {
            display: flex;
            flex-direction: row;
            gap: 40px;
        }
        .hero {
            min-height: 400px;
            padding: 40px;
            display: flex;
            justify-content: space-between;
            flex-direction: row 2;
            padding-right: 250px;
        }

        .hero-content {
            text-align: center;
            max-width: 700px;
            display: flex;
            color: #224F34;
            flex-direction: column;
            padding-left: 80px;
            text-align: left;
            font-family:Georgia;
            gap: 10px;
            display: flex;
                       
        }
        .dhero{
        max-width: 500px;
        }
        .hero h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 15px;
        }
        
        .nav{
            display: flex;
            align-items: center;
            gap: 50px;
            justify-content: center;
           
            
        }
        .log{
            display: flex;
            align-items: center;
            gap: 50px;
            justify-content: center;
        }
        .st{
            border: 2px solid #224F34; 
            padding: 15px; 
            border-radius: 3px;  
            width: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .photo{
            display: flex;
            flex-direction: row-reverse;
            flex-direction: row 1;
        }
        button {
            width: 142px;
            height: 52px;
            color: #224f34;
            background-color: #c2efd4;
            border: 1px solid #224f34;
            border-radius: 3px;
            font-family: Poppins;
            font-weight: 500;
            font-style: Medium;
            font-size: 20px;
            line-height: 100%;
            letter-spacing: 0%;
            text-transform: uppercase;
    }
    </style>
       
</head>
    

<body>
    <header>

        <div class="logo">
            <h1>Rivo</h1>
        </div>

        <div class="nav">   
            <h2>HOME</h2>
            <h2>SHOP</h2>
            <h2>FEATURES</h2>
            <h2>CONTACT</h2>
        </div>
        <div class="log">
            <div class="korzina">
                <img src="Korzina/Снимок экрана 2026-10-01 182817.png" alt="" width="30" height="30">
            </div>
            <h4 class="st">LOGIN</h4>
        </div>

    </header>
    <section class="hero">
        <div class="hero-content">
            <h1 style="font-size:70px;">Discover and Find Your Own Fashion!</h1>
            <p class="dhero" style="font-size: 25px;" >Explore our curated collection of stylish clothing and accessories tailored to your unique taste</p> 
        </div>
        <img src="Mask group.png" alt="">
    </section>
    






</body>



</html>
